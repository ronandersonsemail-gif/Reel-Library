<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Reel Safe</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:16px}main{max-width:900px;margin:auto;padding:16px}
h1{margin:0 0 10px;font-size:28px}.tagline{font-size:13px;opacity:.75;margin-bottom:12px}
.card{background:white;padding:14px;margin:12px 0;border-radius:14px;box-shadow:0 1px 3px #0001}
input,textarea,select,button{box-sizing:border-box;padding:10px;margin:4px;border-radius:9px;border:1px solid #ccc;font:inherit}
input,textarea,select{width:100%}button{cursor:pointer;background:white}.primary{background:#2563eb;color:white;border-color:#2563eb}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}
.stat{font-size:14px}.muted{color:#64748b;font-size:13px}.folderbar{display:flex;gap:6px;overflow:auto;padding:4px 0 8px}
.folderbar button{white-space:nowrap}.folderbar .active{background:#111827;color:#fff}
.itemhead{display:flex;align-items:center;gap:8px}.source-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.source-facebook{background:#1877f2}.source-youtube{background:#ff0000}.source-tiktok{background:#111}.source-other{background:#7c3aed}
.badge{font-size:12px;background:#eef2ff;padding:4px 7px;border-radius:999px;color:#3730a3}
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 24px);box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#0008}.dialog-card{margin:0}.danger{color:#b91c1c}
.small{font-size:12px}.queue{position:sticky;bottom:8px;background:#111827;color:#fff;padding:10px;border-radius:12px;display:none;margin-top:12px}
</style></head>
<body>
<header><h1>🔒 Reel Safe</h1><div class="tagline">Save, organize and find your favorite videos.</div>
<div class="row"><input id="search" placeholder="Search your saved videos..."><button class="primary" onclick="openAdd()">➕ Add</button><button onclick="manageFolders()">📁 Folders</button><button onclick="backup()">⬇️ Backup</button><button onclick="document.getElementById('restore').click()">⬆️ Restore</button><input id="restore" type="file" accept=".json" hidden></div></header>
<main><div class="card"><div class="stat"><b id="count">0</b> saved · <span id="favcount">0</span> favorites</div><div id="folderbar" class="folderbar"></div></div><div id="list"></div><div id="queue" class="queue"></div></main>

<dialog id="dlg"><div class="card dialog-card"><h2>Add / Edit</h2>
<input id="url" placeholder="Paste a Facebook, YouTube, TikTok or other video link">
<input id="title" placeholder="Title">
<input id="tags" placeholder="Tags, comma separated">
<select id="folder"></select>
<textarea id="notes" placeholder="Notes" rows="4"></textarea>
<div class="row"><button class="primary" onclick="save()">Save</button><button onclick="dlg.close()">Cancel</button></div></div></dialog>

<dialog id="foldersDlg"><div class="card dialog-card"><h2>📁 Folders</h2><div id="folderList"></div><div class="row"><button class="primary" onclick="addFolder()">➕ New Folder</button><button onclick="foldersDlg.close()">Done</button></div></div></dialog>

<script>
const KEY="reelLibrary",FOLDER_KEY="reelFolders";
let a=JSON.parse(localStorage.getItem(KEY)||"[]"),folders=JSON.parse(localStorage.getItem(FOLDER_KEY)||"null")||["Cars","Trucks","Funny","Music","Food","Projects","Unsorted"],edit=null,currentFolder="All",queue=[],queueIndex=0;

const params=new URLSearchParams(location.search),allShared=[...params.values()].join(" "),sharedTitle=params.get("title")||"",sharedText=params.get("text")||"";
const sharedFound=(allShared.match(/https?:\/\/[^\s"'<>]+/i)||[])[0]||"",sharedReelUrl=sharedFound.replace(/[),.;]+$/,"");

const rules=[
 {folder:"Cars",tags:["car","cars","mustang","camaro","corvette","hotrod","hot rod","automotive","auto","classic car","sports car","race car"]},
 {folder:"Trucks",tags:["truck","trucks","semi","semi truck","trucking","pickup","18 wheeler","18-wheeler"]},
 {folder:"Funny",tags:["funny","comedy","joke","humor","hilarious","laugh"]},
 {folder:"Music",tags:["music","song","concert","singer","band","guitar","drums"]},
 {folder:"Food",tags:["food","recipe","cooking","baking","grill","grilling","bbq","barbecue"]},
 {folder:"Projects",tags:["project","build","how to","diy","tutorial","repair","welding","fabrication"]}
];

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function persist(){localStorage.setItem(KEY,JSON.stringify(a));localStorage.setItem(FOLDER_KEY,JSON.stringify(folders));render()}
function sourceOf(u){u=(u||"").toLowerCase();if(u.includes("facebook.com")||u.includes("fb.watch"))return["Facebook","source-facebook"];if(u.includes("youtube.com")||u.includes("youtu.be"))return["YouTube","source-youtube"];if(u.includes("tiktok.com"))return["TikTok","source-tiktok"];return["Other","source-other"]}
function autoFolder(tags){let t=tags.map(x=>x.toLowerCase());for(const rule of rules){if(!folders.includes(rule.folder))continue;if(rule.tags.some(k=>t.some(x=>x===k||x.includes(k)||k.includes(x))))return rule.folder}return "Unsorted"}
function migrate(){let changed=false;a=a.map(r=>{let n={...r};if(!n.tags)n.tags=[];if(!n.folder){n.folder=autoFolder(n.tags);changed=true}if(n.folderLocked===undefined){n.folderLocked=false;changed=true}if(!n.source){n.source=sourceOf(n.url)[0];changed=true}return n});if(!folders.includes("Unsorted")){folders.push("Unsorted");changed=true}if(changed)localStorage.setItem(KEY,JSON.stringify(a))}
function fillFolders(selected){folder.innerHTML='<option value="__AUTO__">🧠 Auto organize</option>'+folders.map(f=>'<option value="'+esc(f)+'">'+esc(f)+'</option>').join("");folder.value=selected||"__AUTO__"}
function openAdd(id){edit=id||null;let r=a.find(x=>x.id===id);url.value=r?r.url:(!id?sharedReelUrl:"");title.value=r?r.title:(!id?(sharedTitle||"Saved video"):"");tags.value=r?r.tags.join(", "):"";notes.value=r?r.notes:(!id&&sharedText!==sharedReelUrl?sharedText:"");fillFolders(r?(r.folderLocked?r.folder:"__AUTO__"):"__AUTO__");dlg.showModal()}
function save(){let u=url.value.trim();if(!/^https?:\/\//i.test(u))return alert("Please enter a full video link.");let old=a.find(x=>x.id===edit),ts=tags.value.split(",").map(x=>x.trim()).filter(Boolean),chosen=folder.value,locked=chosen!=="__AUTO__",fo=locked?chosen:((old&&!old.folderLocked)?autoFolder(ts):autoFolder(ts));if(!folders.includes(fo))folders.push(fo);let r={id:edit||crypto.randomUUID(),url:u,title:title.value.trim()||"Saved video",tags:ts,notes:notes.value.trim(),favorite:old?!!old.favorite:false,date:old?old.date:new Date().toISOString(),folder:fo,folderLocked:locked,source:sourceOf(u)[0]};if(edit)a=a.map(x=>x.id===edit?r:x);else a.unshift(r);dlg.close();persist()}
function fav(id){let r=a.find(x=>x.id===id);r.favorite=!r.favorite;persist()}
function del(id){if(confirm("Delete this saved video?")){a=a.filter(x=>x.id!==id);persist()}}
function moveAuto(id){let r=a.find(x=>x.id===id);if(!r)return;r.folder=autoFolder(r.tags);r.folderLocked=false;persist()}
function renderFolders(){let names=["All",...folders];folderbar.innerHTML=names.map(f=>'<button type="button" data-folder="'+esc(f)+'">'+(f==="All"?"📚 All":("📁 "+esc(f)))+'</button>').join("");folderbar.querySelectorAll("button").forEach(btn=>{if(btn.dataset.folder===currentFolder)btn.classList.add("active")})}
function selectFolder(f){currentFolder=f;render()}
if(!folderbar.dataset.bound){folderbar.dataset.bound="1";folderbar.addEventListener("click",e=>{let btn=e.target.closest("button[data-folder]");if(!btn)return;selectFolder(btn.dataset.folder)})}
function render(){let q=search.value.toLowerCase();renderFolders();let b=a.filter(r=>(currentFolder==="All"||r.folder===currentFolder)&&(r.title+" "+r.url+" "+r.notes+" "+r.tags.join(" ")).toLowerCase().includes(q));count.textContent=a.length;favcount.textContent=a.filter(r=>r.favorite).length;if(!b.length){list.innerHTML='<div class="card">Nothing here yet. Share a video to Reel Safe or tap Add.</div>';return}
let play=currentFolder!=="All"?'<button onclick="playFolder()">▶️ Play Folder</button>':"";
list.innerHTML=(play?'<div class="card"><div class="row">'+play+'<span class="muted">'+b.length+' videos in this folder</span></div></div>':"")+b.map(r=>{let [src,cls]=sourceOf(r.url),locked=r.folderLocked;return '<div class="card"><div class="itemhead"><span class="source-dot '+cls+'"></span><h3 style="margin:0">'+esc(r.title)+'</h3>'+(r.favorite?'⭐':'')+'</div><div class="muted">'+esc(src)+' · 📁 '+esc(r.folder)+(locked?' · 🔒 manual': ' · 🧠 auto')+'</div><div class="muted">'+esc(r.tags.join(" · "))+'</div><p>'+esc(r.notes)+'</p><div class="row"><button class="primary" onclick=\'window.open('+JSON.stringify(r.url)+'," _blank")\'>▶️ Open</button><button onclick=\'fav("'+r.id+'")\'>'+(r.favorite?'☆ Unfavorite':'⭐ Favorite')+'</button><button onclick=\'openAdd("'+r.id+'")\'>✏️ Edit</button>'+(locked?'<button onclick=\'moveAuto("'+r.id+'")\'>🧠 Auto</button>':"")+'<button onclick=\'del("'+r.id+'")\'>🗑️ Delete</button></div></div>'}).join("")}
function manageFolders(){folderList.innerHTML=folders.map(f=>'<div class="row"><span style="flex:1">📁 '+esc(f)+'</span>'+(f==="Unsorted"?"":'<button class="danger" onclick=\'removeFolder('+JSON.stringify(f)+')\'>Delete</button>')+'</div>').join("");foldersDlg.showModal()}
function addFolder(){let n=prompt("Name for the new folder:");n=(n||"").trim();if(!n||folders.includes(n))return;if(!folders.includes(n))folders.splice(folders.length-1,0,n);persist();manageFolders()}
function removeFolder(f){if(!confirm("Delete folder '"+f+"'? Saved videos will move to Unsorted."))return;a.forEach(r=>{if(r.folder===f){r.folder="Unsorted";r.folderLocked=false}});folders=folders.filter(x=>x!==f);persist();manageFolders()}
function playFolder(){let q=a.filter(r=>r.folder===currentFolder);if(!q.length)return;queue=q;queueIndex=0;showQueue();window.open(q[0].url,"_blank")}
function showQueue(){queueEl=document.getElementById("queue");if(!queue.length){queueEl.style.display="none";return}queueEl.style.display="block";queueEl.innerHTML='<b>▶️ '+esc(currentFolder)+'</b> · '+(queueIndex+1)+' of '+queue.length+' <button onclick="nextInQueue()">Next ▶️</button><button onclick="stopQueue()">Stop</button>'}
function nextInQueue(){queueIndex++;if(queueIndex>=queue.length)return stopQueue();showQueue();window.open(queue[queueIndex].url,"_blank")}
function stopQueue(){queue=[];document.getElementById("queue").style.display="none"}
function backup(){let b=new Blob([JSON.stringify({version:2,reels:a,folders},null,2)],{type:"application/json"}),x=document.createElement("a");x.href=URL.createObjectURL(b);x.download="reel-safe-backup.json";x.click()}
restore.onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);let reels=Array.isArray(x)?x:x.reels;if(confirm("Replace your library with this backup?")){a=reels||[];folders=Array.isArray(x.folders)?x.folders:folders;migrate();persist()}}catch{alert("Invalid backup.")}};r.readAsText(f)}
search.oninput=render;migrate();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(params.get("share")==="1"&&sharedReelUrl)setTimeout(()=>{openAdd();url.value=sharedReelUrl;title.value=sharedTitle||"Saved video";notes.value=sharedText&&sharedText!==sharedReelUrl?sharedText:""},300);
</script></body></html>
