<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Reel Library</title><style>body{font-family:Arial;margin:0;background:#f3f4f6}header{background:#111827;color:white;padding:16px}main{max-width:900px;margin:auto;padding:16px}.card{background:white;padding:14px;margin:12px 0;border-radius:12px}input,textarea,button{box-sizing:border-box;padding:10px;margin:4px;border-radius:8px;border:1px solid #ccc;font:inherit}input,textarea{width:100%}button{cursor:pointer}.primary{background:#2563eb;color:white}.row{display:flex;gap:6px;flex-wrap:wrap}.muted{color:#64748b;font-size:13px}</style></head><body><header><h1>🎬 Reel Library</h1><div class="row"><input id="search" placeholder="Search your Reels..."><button class="primary" onclick="openAdd()">➕ Add Reel</button><button onclick="backup()">⬇️ Backup</button><button onclick="document.getElementById('restore').click()">⬆️ Restore</button><input id="restore" type="file" accept=".json" hidden></div></header><main><div class="card"><b id="count">0</b> Reels saved · <span id="favcount">0</span> favorites</div><div id="list"></div></main><dialog id="dlg"><div class="card"><h2>Add / Edit Reel</h2><input id="url" placeholder="Facebook Reel link"><input id="title" placeholder="Title"><input id="tags" placeholder="Tags, comma separated"><textarea id="notes" placeholder="Notes" rows="4"></textarea><div class="row"><button class="primary" onclick="save()">Save</button><button onclick="dlg.close()">Cancel</button></div></div></dialog><script>
const KEY="reelLibrary";let a=JSON.parse(localStorage.getItem(KEY)||"[]"),edit=null;
const params=new URLSearchParams(location.search),sharedUrl=params.get("url")||"",sharedTitle=params.get("title")||"",sharedText=params.get("text")||"";
const sharedSource=sharedUrl||sharedText||"";
const sharedFound=(sharedSource.match(/https?:\/\/[^\s]+/i)||[])[0]||"";
const sharedReelUrl=sharedFound.replace(/[),.;]+$/,"");
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function persist(){localStorage.setItem(KEY,JSON.stringify(a));render()}
function openAdd(id){edit=id||null;let r=a.find(x=>x.id===id);url.value=r?r.url:(!id?sharedUrl:"");title.value=r?r.title:(!id?(sharedTitle||"Facebook Reel"):"");tags.value=r?r.tags.join(", "):"";notes.value=r?r.notes:(!id?sharedText:"");dlg.showModal()}
function save(){if(!/^https?:\/\//i.test(url.value.trim()))return alert("Please enter the full Facebook Reel link.");let old=a.find(x=>x.id===edit),r={id:edit||crypto.randomUUID(),url:url.value.trim(),title:title.value.trim()||"Facebook Reel",tags:tags.value.split(",").map(x=>x.trim()).filter(Boolean),notes:notes.value.trim(),favorite:old?old.favorite:false,date:old?old.date:new Date().toISOString()};if(edit)a=a.map(x=>x.id===edit?r:x);else a.unshift(r);dlg.close();persist()}
function fav(id){let r=a.find(x=>x.id===id);r.favorite=!r.favorite;persist()}
function del(id){if(confirm("Delete this Reel?")){a=a.filter(x=>x.id!==id);persist()}}
function render(){let q=search.value.toLowerCase(),b=a.filter(r=>(r.title+" "+r.url+" "+r.notes+" "+r.tags.join(" ")).toLowerCase().includes(q));count.textContent=a.length;favcount.textContent=a.filter(r=>r.favorite).length;if(!b.length){list.innerHTML='<div class="card">No Reels found. Tap Add Reel to save one.</div>';return}list.innerHTML=b.map(r=>'<div class="card"><h3>'+esc(r.title)+' '+(r.favorite?'⭐':'')+'</h3><div class="muted">'+esc(r.tags.join(" · "))+'</div><p>'+esc(r.notes)+'</p><div class="row"><button class="primary" onclick=\'window.open('+JSON.stringify(r.url)+'," _blank")\'>▶️ Open Reel</button><button onclick=\'fav("'+r.id+'")\'>'+(r.favorite?'☆ Unfavorite':'⭐ Favorite')+'</button><button onclick=\'openAdd("'+r.id+'")\'>✏️ Edit</button><button onclick=\'del("'+r.id+'")\'>🗑️ Delete</button></div></div>').join("")}
function backup(){let b=new Blob([JSON.stringify(a,null,2)],{type:"application/json"}),x=document.createElement("a");x.href=URL.createObjectURL(b);x.download="reel-library-backup.json";x.click()}
restore.onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(confirm("Replace your library with this backup?")){a=x;persist()}}catch{alert("Invalid backup.")}};r.readAsText(f)}
search.oninput=render;render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(params.get("share")==="1"&&sharedReelUrl)setTimeout(()=>{openAdd();url.value=sharedReelUrl;if(!title.value||title.value==="Facebook Reel")title.value=sharedTitle||"Facebook Reel";notes.value=sharedText&&sharedText!==sharedReelUrl?sharedText:"";},300);
</script></body></html>
